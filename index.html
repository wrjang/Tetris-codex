<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-layout">
      <canvas
        id="game-board"
        width="300"
        height="600"
        aria-label="테트리스 게임 보드"
      ></canvas>

      <aside class="score-panel" aria-label="점수 영역">
        <h1>TETRIS</h1>
        <div class="stats-grid">
          <div>
            <p class="stat-label">SCORE</p>
            <p id="score" class="stat-value">0</p>
          </div>
          <div>
            <p class="stat-label">LEVEL</p>
            <p id="level" class="stat-value">1</p>
          </div>
        </div>
        <div class="next-panel">
          <p class="stat-label">NEXT</p>
          <canvas
            id="next-piece"
            width="120"
            height="120"
            aria-label="다음 블록 미리보기"
          ></canvas>
        </div>
        <p id="game-status" class="game-status" aria-live="polite" hidden>
          게임 오버
        </p>
        <button id="restart-button" class="restart-button" type="button">
          다시 시작
        </button>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
